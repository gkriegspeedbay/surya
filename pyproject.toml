[tool.poetry]
name = "surya-ocr"
version = "0.17.1"
description = "OCR, layout, reading order, and table recognition in 90+ languages"
authors = ["Vik Paruchuri <vik.paruchuri@gmail.com>"]
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/VikParuchuri/surya"
keywords = ["ocr", "pdf", "text detection", "text recognition", "tables"]
packages = [
    {include = "surya"}
]

[tool.poetry.dependencies]
python = "^3.10"
transformers = ">=4.56.1"
torch = "^2.7.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
# Relaxed from "^10.2.0" (<11) per datalab-to/surya#519: no removed-in-11 API
# usage found (Image.ANTIALIAS / ImageDraw.textsize / ImageFont.getsize), full
# test suite green on 12.2.0. Needed for CVE fixes (12.1.1+) unreachable under
# the old cap.
pillow = ">=10.2.0,<13"
# Bumped from "=4.30.0" (STANDARDS SS6.9.1 bump flow: reviewed the full
# pypdfium2 changelog 4.30.0->5.11.0. One relevant breaking change --
# PdfDocument.render() removed in 5.0.0 -- fixed in surya/scripts/
# streamlit_app.py and texify_app.py (switched to PdfPage.render(), which
# surya/input/processing.py already used correctly). Full test suite green.
# PINNED TO 5.9.0, NOT THE PYPI-LATEST 5.11.0: marker's OTHER direct
# dependency pdftext hard-pins pypdfium2 to an EXACT version too (their own
# comment: "every pypdfium2 minor swaps the pdfium binary and silently
# changes extraction output" -- deliberate, not an oversight). pdftext's
# latest release (0.7.0) pins exactly 5.9.0; matching it here is what
# actually makes marker+pdftext+surya resolve together at all. 5.9.0 is
# the real achievable "latest" for this dependency given the full graph,
# not pypdfium2's own standalone PyPI latest.
pypdfium2 = "=5.9.0"
filetype = "^1.2.0"
click = "^8.1.8"
platformdirs = "^4.3.6"
# Bumped from "==4.11.0.86" (STANDARDS SS6.9.1 bump flow: reviewed OpenCV's
# 4-to-5 migration guide against surya's actual cv2 usage across all 5
# call sites -- no relevant breaking change found (no INTER_NEAREST, no
# warp*, no C-API/DNN/ML/calib3d/VideoCapture/text-rendering calls; the
# one plausible touchpoint, 1D-array-to-Mat semantics, doesn't apply since
# surya always builds explicit 2D arrays before calling cv2). Full test
# suite green, including the detection path that exercises
# connectedComponentsWithStats -> minAreaRect -> boxPoints.
opencv-python-headless = "==5.0.0.93"
einops = "^0.8.1"
pre-commit = "^4.2.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
pytesseract = "^0.3.10"
pymupdf = "^1.23.8"
datasets = "^2.16.1"
rapidfuzz = "^3.6.1"
streamlit = "^1.31.0"
pytest = "^8.3.4"
# Bumped from "^0.5.1" (STANDARDS SS6.9.1 bump flow: caught by `poetry lock`
# failing to resolve -- pdftext 0.5.1 hard-pins pypdfium2==4.30.0, which
# conflicts with the pypdfium2 =5.9.0 bump above. Matches the ~0.7.0 marker
# uses; reviewed the same way (all 18 commits between v0.6.3 and v0.7.0
# reviewed for the marker bump -- no breaking change to any API surya's
# dev/benchmark usage of pdftext would call).
pdftext = "^0.7.0"
tabulate = "^0.9.0"

[tool.poetry.scripts]
surya_detect = "surya.scripts.detect_text:detect_text_cli"
surya_ocr = "surya.scripts.ocr_text:ocr_text_cli"
surya_layout = "surya.scripts.detect_layout:detect_layout_cli"
surya_gui = "surya.scripts.run_streamlit_app:streamlit_app_cli"
surya_table = "surya.scripts.table_recognition:table_recognition_cli"
surya_latex_ocr = "surya.scripts.ocr_latex:ocr_latex_cli"
texify_gui = "surya.scripts.run_texify_app:texify_app_cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "libtpu-releases"
url = "https://storage.googleapis.com/libtpu-releases/index.html"
priority = "supplemental"

[[tool.poetry.source]]
name = "libtpu-wheels"
url = "https://storage.googleapis.com/libtpu-wheels/index.html"
priority = "supplemental"

[tool.poetry.group.xla]
optional = true

[tool.poetry.group.xla.dependencies]
torch-xla = {version = "^2.4.1", extras = ["tpu"]}
